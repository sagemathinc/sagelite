name: Test staged Sagelite wheel index

on:
  workflow_dispatch:
    inputs:
      index_url:
        description: "Simple index URL. Defaults to this repository's GitHub Pages simple index."
        required: false
        default: ""
        type: string
      python_version:
        description: "Python version to use for the install test"
        required: false
        default: "3.14"
        type: choice
        options:
          - "3.12"
          - "3.13"
          - "3.14"
      package_spec:
        description: "Package spec to install from the staged index"
        required: false
        default: "sagelite[full]"
        type: string
      test_command:
        description: "Command to run after sagelite-selftest"
        required: false
        default: "test-venv/bin/python tools/run-installed-wheel-doctests.py --output-dir .local-build-logs --label staged-index"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Resolve staged index URL
        id: index
        env:
          INPUT_INDEX_URL: ${{ inputs.index_url }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_INDEX_URL}" ]; then
            echo "url=${INPUT_INDEX_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple" >> "$GITHUB_OUTPUT"
          fi

      - name: Install from staged wheel index
        env:
          INDEX_URL: ${{ steps.index.outputs.url }}
          PACKAGE_SPEC: ${{ inputs.package_spec }}
        run: |
          set -euo pipefail
          python -m venv test-venv
          test-venv/bin/python -m pip install --upgrade pip
          test-venv/bin/python -m pip install --extra-index-url "${INDEX_URL}" "${PACKAGE_SPEC}"
          test-venv/bin/python -m pip install pytest
          test-venv/bin/python -m pip check

      - name: Run installed-wheel tests
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          set -euo pipefail
          test-venv/bin/sagelite-selftest
          if [ -n "${TEST_COMMAND}" ]; then
            eval "${TEST_COMMAND}"
          fi

      - name: Upload installed-wheel doctest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-index-installed-wheel-doctests-py${{ inputs.python_version }}
          path: .local-build-logs/*
          if-no-files-found: ignore
