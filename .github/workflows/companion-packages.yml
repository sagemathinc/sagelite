name: Companion Packages

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish built companion distributions to PyPI"
        required: false
        default: false
        type: boolean
      publish_to_github_pages:
        description: "Publish built wheels to the gh-pages simple index"
        required: false
        default: false
        type: boolean
      publish_to_cloudflare_pages:
        description: "Publish built wheels to Cloudflare R2 and a Pages simple index"
        required: false
        default: false
        type: boolean
      skip_slow_cloudflare_companions:
        description: "Skip very slow companion builds when only staging to Cloudflare"
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sagelite-cunningham-tables
            import_name: sagelite_cunningham_tables
            path: companion-packages/sagelite-cunningham-tables
            apt_packages: ""
            publish: true
          - name: sagelite-database-cremona-mini
            import_name: sagelite_database_cremona_mini
            path: companion-packages/sagelite-database-cremona-mini
            apt_packages: ""
            publish: true
          - name: sagelite-database-cremona-ellcurve
            import_name: sagelite_database_cremona_ellcurve
            path: companion-packages/sagelite-database-cremona-ellcurve
