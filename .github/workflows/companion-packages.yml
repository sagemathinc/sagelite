            apt_packages: topcom
            publish: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system payload dependencies
        if: ${{ matrix.apt_packages != '' }}
        run: |
          sudo add-apt-repository --yes universe
          if [ "${{ matrix.name }}" = "sagelite-maxima-runtime" ]; then
            cat <<'EOF' | sudo tee /etc/apt/sources.list.d/sagelite-maxima-sage.sources
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: questing
          Components: universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            cat <<'EOF' | sudo tee /etc/apt/preferences.d/sagelite-maxima-sage
          Package: *
          Pin: release n=questing
          Pin-Priority: 100

          Package: maxima-sage maxima-sage-share ecl libecl-dev libecl24.5
          Pin: release n=questing
          Pin-Priority: 990
          EOF
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.apt_packages }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: |
          if [ "${{ matrix.name }}" = "sagelite-gap-runtime" ]; then
            export SAGELITE_GAP_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-atlasrep" ]; then
            export SAGELITE_GAP_ATLASREP_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-ctbllib" ]; then
            export SAGELITE_GAP_CTBLLIB_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-design" ]; then
            export SAGELITE_GAP_DESIGN_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-gapdoc" ]; then
            export SAGELITE_GAP_GAPDOC_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-grape" ]; then
            export SAGELITE_GAP_GRAPE_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-guava" ]; then
            export SAGELITE_GAP_GUAVA_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-hap" ]; then
            tarball="$(PYTHONPATH=build build/bin/sage-package download gap_packages | tail -n 1)"
            mkdir -p "$RUNNER_TEMP/gap-packages-src"
            tar -xzf "$tarball" -C "$RUNNER_TEMP/gap-packages-src"
            export SAGELITE_GAP_HAP_ROOT="$(find "$RUNNER_TEMP/gap-packages-src" -maxdepth 2 -type d -name pkg -printf '%h\n' | head -n 1)"
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-polenta" ]; then
            tarball="$(PYTHONPATH=build build/bin/sage-package download gap_packages | tail -n 1)"
            mkdir -p "$RUNNER_TEMP/gap-packages-src"
            tar -xzf "$tarball" -C "$RUNNER_TEMP/gap-packages-src"
            export SAGELITE_GAP_POLENTA_ROOT="$(find "$RUNNER_TEMP/gap-packages-src" -maxdepth 2 -type d -name pkg -printf '%h\n' | head -n 1)"
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-polycyclic" ]; then
            export SAGELITE_GAP_POLYCYCLIC_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-primgrp" ]; then
            export SAGELITE_GAP_PRIMGRP_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-qpa" ]; then
            tarball="$(PYTHONPATH=build build/bin/sage-package download gap_packages | tail -n 1)"
            mkdir -p "$RUNNER_TEMP/gap-packages-src"
            tar -xzf "$tarball" -C "$RUNNER_TEMP/gap-packages-src"
            export SAGELITE_GAP_QPA_ROOT="$(find "$RUNNER_TEMP/gap-packages-src" -maxdepth 2 -type d -name pkg -printf '%h\n' | head -n 1)"
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-quagroup" ]; then
            tarball="$(PYTHONPATH=build build/bin/sage-package download gap_packages | tail -n 1)"
            mkdir -p "$RUNNER_TEMP/gap-packages-src"
            tar -xzf "$tarball" -C "$RUNNER_TEMP/gap-packages-src"
            export SAGELITE_GAP_QUAGROUP_ROOT="$(find "$RUNNER_TEMP/gap-packages-src" -maxdepth 2 -type d -name pkg -printf '%h\n' | head -n 1)"
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-repsn" ]; then
            tarball="$(PYTHONPATH=build build/bin/sage-package download gap_packages | tail -n 1)"
            mkdir -p "$RUNNER_TEMP/gap-packages-src"
            tar -xzf "$tarball" -C "$RUNNER_TEMP/gap-packages-src"
            export SAGELITE_GAP_REPSN_ROOT="$(find "$RUNNER_TEMP/gap-packages-src" -maxdepth 2 -type d -name pkg -printf '%h\n' | head -n 1)"
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-smallgrp" ]; then
            export SAGELITE_GAP_SMALLGRP_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-tomlib" ]; then
            export SAGELITE_GAP_TOMLIB_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gap-package-transgrp" ]; then
            export SAGELITE_GAP_TRANSGRP_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-gfan-runtime" ]; then
            export SAGELITE_GFAN_BINDIR=/usr/bin
          fi
          if [ "${{ matrix.name }}" = "sagelite-giac-runtime" ]; then
            export SAGELITE_GIAC_BINDIR=/usr/bin
          fi
          if [ "${{ matrix.name }}" = "sagelite-4ti2-runtime" ]; then
            export SAGELITE_4TI2_BINDIR=/usr/bin
          fi
          if [ "${{ matrix.name }}" = "sagelite-cddlib-runtime" ]; then
            export SAGELITE_CDDLIB_BINDIR=/usr/bin
          fi
          if [ "${{ matrix.name }}" = "sagelite-csdp-runtime" ]; then
            export SAGELITE_CSDP_BINDIR=/usr/bin
          fi
          if [ "${{ matrix.name }}" = "sagelite-dvipng-runtime" ]; then
            export SAGELITE_DVIPNG_BINDIR=/usr/bin
          fi
          if [ "${{ matrix.name }}" = "sagelite-ecl-runtime" ]; then
            export SAGELITE_ECL_PREFIX=/usr
          fi
          if [ "${{ matrix.name }}" = "sagelite-benzene-runtime" ]; then
            tarball="$(PYTHONPATH=build build/bin/sage-package download benzene | tail -n 1)"
            mkdir -p "$RUNNER_TEMP/benzene-src"
            tar -xjf "$tarball" -C "$RUNNER_TEMP/benzene-src"
            make -C "$RUNNER_TEMP/benzene-src/src" CFLAGS="-std=gnu89 -O4 -Wall -DNOLOG"
            export SAGELITE_BENZENE_BINDIR="$RUNNER_TEMP/benzene-src/src"
          fi
          if [ "${{ matrix.name }}" = "sagelite-buckygen-runtime" ]; then
            tarball="$(PYTHONPATH=build build/bin/sage-package download buckygen | tail -n 1)"
            mkdir -p "$RUNNER_TEMP/buckygen-src"
            unzip -q "$tarball" -d "$RUNNER_TEMP/buckygen-src"
            buckygen_src="$(find "$RUNNER_TEMP/buckygen-src" -maxdepth 2 -type f -name buckygen.c -printf '%h\n' | head -n 1)"
            make -C "$buckygen_src" CFLAGS="-std=gnu89 -O3"
            export SAGELITE_BUCKYGEN_BINDIR="$buckygen_src"
          fi
          if [ "${{ matrix.name }}" = "sagelite-ecm-runtime" ]; then
