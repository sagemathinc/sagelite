name: Companion Packages

on:
  push:
    branches:
      - develop
    paths:
      - 'companion-packages/**'
      - 'src/sage/env.py'
      - 'src/sage/env_test.py'
      - 'src/sage/libs/pari/__init__.py'
      - 'src/sage/libs/singular/function.pyx'
      - '.github/workflows/companion-packages.yml'
  pull_request:
    paths:
      - 'companion-packages/**'
      - 'src/sage/env.py'
      - 'src/sage/env_test.py'
      - 'src/sage/libs/pari/__init__.py'
      - 'src/sage/libs/singular/function.pyx'
      - '.github/workflows/companion-packages.yml'
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish built companion distributions to PyPI"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sagelite-database-cremona-mini
            import_name: sagelite_database_cremona_mini
            path: companion-packages/sagelite-database-cremona-mini
            apt_packages: ""
            publish: true
          - name: sagelite-database-ellcurves
            import_name: sagelite_database_ellcurves
            path: companion-packages/sagelite-database-ellcurves
            apt_packages: ""
            publish: true
          - name: sagelite-database-graphs
            import_name: sagelite_database_graphs
            path: companion-packages/sagelite-database-graphs
            apt_packages: ""
            publish: true
          - name: sagelite-database-polytopes
            import_name: sagelite_database_polytopes
            path: companion-packages/sagelite-database-polytopes
            apt_packages: ""
            publish: true
          - name: sagelite-gap-runtime
            import_name: sagelite_gap_runtime
            path: companion-packages/sagelite-gap-runtime
            apt_packages: gap gap-gapdoc gap-smallgrp gap-transgrp gap-primgrp gap-character-tables gap-table-of-marks
            publish: false
          - name: sagelite-nauty-runtime
            import_name: sagelite_nauty
            path: companion-packages/sagelite-nauty-runtime
            apt_packages: nauty
            publish: false
          - name: sagelite-pari-data
            import_name: sagelite_pari_data
            path: companion-packages/sagelite-pari-data
            apt_packages: pari-galdata pari-seadata
            publish: false
          - name: sagelite-singular-runtime
            import_name: sagelite_singular_runtime
            path: companion-packages/sagelite-singular-runtime
            apt_packages: singular
            publish: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system payload dependencies
        if: ${{ matrix.apt_packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.apt_packages }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: |
          if [ "${{ matrix.name }}" = "sagelite-gap-runtime" ]; then
            export SAGELITE_GAP_ROOT=/usr/share/gap
          fi
          if [ "${{ matrix.name }}" = "sagelite-nauty-runtime" ]; then
            export SAGELITE_NAUTY_BINDIR=/usr/bin
          fi
          if [ "${{ matrix.name }}" = "sagelite-pari-data" ]; then
            export SAGELITE_PARI_DATA_DIR=/usr/share/pari
          fi
          if [ "${{ matrix.name }}" = "sagelite-singular-runtime" ]; then
            export SAGELITE_SINGULAR_ROOT=/usr
          fi
          python -m build "${{ matrix.path }}" --outdir dist
          ls -lh dist

      - name: Smoke test built wheel
        run: |
          python -m venv test-venv
          test-venv/bin/python -m pip install --upgrade pip
          test-venv/bin/python -m pip install dist/*.whl
          export PATH="$PWD/test-venv/bin:$PATH"
          test-venv/bin/python - <<'PY'
          import importlib
          import importlib.metadata as metadata
          import os
          import sqlite3

          module = importlib.import_module("${{ matrix.import_name }}")
          if "${{ matrix.name }}" == "sagelite-gap-runtime":
              runtime = importlib.import_module("sagelite_gap_runtime.runtime")
              gap_root = runtime.gap_root()
              gap_root_paths = runtime.gap_root_paths()
              print("gap_root=", gap_root)
              print("gap_root_paths=", gap_root_paths)
              assert os.path.exists(os.path.join(gap_root, "lib", "init.g"))
              assert gap_root in gap_root_paths.split(";")
              os.environ["GAP_ROOT_PATHS"] = gap_root_paths
              import subprocess
              subprocess.run(
                  ["gap", "-r", "-q", "--bare", "--nointeract"],
                  input='LoadPackage("gapdoc");; NumberSmallGroups(16);; NrTransitiveGroups(5);;\\n',
                  text=True,
                  check=True,
              )
              raise SystemExit(0)

          if "${{ matrix.name }}" == "sagelite-nauty-runtime":
              runtime = importlib.import_module("sagelite_nauty.runtime")
              geng = runtime.executable_path("geng")
              genposetg = runtime.executable_path("genposetg")
              print("geng=", geng)
              print("genposetg=", genposetg)
              assert geng.exists()
              assert genposetg.exists()
              import shutil
              import subprocess
              assert shutil.which("geng")
              assert shutil.which("genposetg")
              subprocess.run(["geng", "-q", "3"], check=True, capture_output=True, text=True)
              subprocess.run(["genposetg", "-q", "3"], check=True, capture_output=True, text=True)
              raise SystemExit(0)

          if "${{ matrix.name }}" == "sagelite-pari-data":
              runtime = importlib.import_module("sagelite_pari_data.runtime")
              data_dir = runtime.pari_data_dir()
              print("pari_data_dir=", data_dir)
              assert os.path.exists(os.path.join(data_dir, "galdata", "COS8_49_45"))
              assert os.path.exists(os.path.join(data_dir, "seadata"))
              raise SystemExit(0)

          if "${{ matrix.name }}" == "sagelite-singular-runtime":
              runtime = importlib.import_module("sagelite_singular_runtime.runtime")
              root_dir = runtime.singular_root_dir()
              default_dir = runtime.singular_default_dir()
              print("singular_root_dir=", root_dir)
              print("singular_default_dir=", default_dir)
              assert os.path.exists(os.path.join(root_dir, "share", "singular", "LIB", "standard.lib"))
              assert os.path.exists(os.path.join(default_dir, "share", "singular", "LIB", "freegb.lib"))
              assert any(
                  "MOD/freealgebra.so" in os.path.join(path, filename)
                  for path, _, filenames in os.walk(root_dir)
                  for filename in filenames
              )
              raise SystemExit(0)

          if "${{ matrix.name }}" == "sagelite-database-graphs":
              data_path = module.sage_data_path()
              graphs_path = module.graphs_data_path()
              db_path = module.graphs_db_path()
              print("data_path=", data_path)
              print("graphs_path=", graphs_path)
              print("db_path=", db_path)
              assert db_path.endswith("graphs.db"), db_path
              assert os.path.exists(os.path.join(graphs_path, "brouwer_srg_database.json"))
              assert os.path.exists(os.path.join(graphs_path, "isgci_sage.xml"))
              assert os.path.exists(os.path.join(graphs_path, "smallgraphs.txt"))
              assert any(ep.name == "graphs" for ep in metadata.entry_points(group="sagemath.data_paths"))
              con = sqlite3.connect(db_path)
              cur = con.cursor()
              assert cur.execute("select count(*) from graph_data").fetchone()[0] > 0
              raise SystemExit(0)

          if "${{ matrix.name }}" == "sagelite-database-ellcurves":
              data_path = module.sage_data_path()
              ellcurves_path = module.ellcurves_data_path()
              rank0_path = module.rank_file_path(0)
              rank1_path = module.rank_file_path(1)
              print("data_path=", data_path)
              print("ellcurves_path=", ellcurves_path)
              print("rank0_path=", rank0_path)
              assert rank0_path.endswith("rank0"), rank0_path
              assert os.path.exists(rank0_path)
              assert os.path.exists(rank1_path)
              assert os.path.getsize(rank0_path) > 0
              assert os.path.getsize(rank1_path) > 0
              assert any(ep.name == "ellcurves" for ep in metadata.entry_points(group="sagemath.data_paths"))
              raise SystemExit(0)

          if "${{ matrix.name }}" == "sagelite-database-polytopes":
              data_path = module.sage_data_path()
              polytopes_path = module.reflexive_polytopes_path()
              print("data_path=", data_path)
              print("polytopes_path=", polytopes_path)
              assert os.path.isdir(os.path.join(polytopes_path, "Full2d"))
              assert os.path.isdir(os.path.join(polytopes_path, "Full3d"))
              assert os.path.exists(os.path.join(polytopes_path, "reflexive_polytopes_2d"))
              assert os.path.exists(os.path.join(polytopes_path, "reflexive_polytopes_3d"))
              assert any(ep.name == "reflexive_polytopes" for ep in metadata.entry_points(group="sagemath.data_paths"))
              raise SystemExit(0)

          if "${{ matrix.name }}" == "sagelite-database-cremona-mini":
              data_path = module.sage_data_path()
              db_path = module.cremona_mini_path()
              print("data_path=", data_path)
              print("db_path=", db_path)
              assert db_path.endswith("cremona_mini.db"), db_path
              assert any(ep.name == "cremona_mini" for ep in metadata.entry_points(group="sagemath.data_paths"))
              con = sqlite3.connect(db_path)
              cur = con.cursor()
              assert cur.execute("select count(*) from t_class").fetchone()[0] > 0
              assert cur.execute("select count(*) from t_curve").fetchone()[0] > 0
              raise SystemExit(0)

          raise AssertionError("unhandled companion package")
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.publish }}
        with:
          name: ${{ matrix.name }}-dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-dist"
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
