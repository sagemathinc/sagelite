name: Companion Packages

on:
  push:
    branches:
      - develop
    paths:
      - 'companion-packages/**'
      - 'src/sage/env.py'
      - 'src/sage/env_test.py'
      - 'src/sage/libs/pari/__init__.py'
      - 'src/sage/libs/singular/function.pyx'
      - '.github/workflows/companion-packages.yml'
  pull_request:
    paths:
      - 'companion-packages/**'
      - 'src/sage/env.py'
      - 'src/sage/env_test.py'
      - 'src/sage/libs/pari/__init__.py'
      - 'src/sage/libs/singular/function.pyx'
      - '.github/workflows/companion-packages.yml'
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish built companion distributions to PyPI"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sagelite-cunningham-tables
            import_name: sagelite_cunningham_tables
            path: companion-packages/sagelite-cunningham-tables
            apt_packages: ""
            publish: true
          - name: sagelite-database-cremona-mini
            import_name: sagelite_database_cremona_mini
            path: companion-packages/sagelite-database-cremona-mini
            apt_packages: ""
            publish: true
          - name: sagelite-database-cremona-ellcurve
