name: Release distributions and wheels

on:
  push:
    tags:
      # Match all release tags including beta, rc
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.beta[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.beta[0-9]+'
      - '[0-9]+.[0-9]+.rc[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.rc[0-9]+'
      - 'sagelite-*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish built artifacts to PyPI"
        required: false
        default: false
        type: boolean

jobs:

  release_dist:

    # This job first checks whether "configure --enable-download-from-upstream-url"
    # (the default since #32390) is needed.
    #
    # In this way, we check that all necessary package tarballs
    # have already been uploaded to the Sage server at the time
    # of pushing a release tag.
    #
    # It also uses "bootstrap -D", thus checking that the "configure"
    # tarball has been uploaded to the Sage server at the time
    # of pushing a release tag.

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bootstrap prerequisites
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install $(build/bin/sage-get-system-packages debian _bootstrap _prereq)
      - name: Configure with --enable-download-from-upstream-url
        run: |
          make configure
          ./configure
      - name: make dist (--enable-download-from-upstream-url)
        id: make_dist
        if: success() || failure()
        run: |
          make dist
        env:
          MAKE: make -j8
      - name: make download (--enable-download-from-upstream-url)
        if: (success() || failure()) && steps.make_dist.outcome != 'success'
        run: |
          make -k download DOWNLOAD_PACKAGES=":all: --no-file huge --allow-upstream"
        env:
          MAKE: make -j8
      - name: Remove what cannot be distributed
        if: success() || failure()
        run: |
          rm -f upstream/*do-not-distribute*
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          path: |
            dist/*.tar.gz
            upstream
          name: release_dist

  sdists:

    # Source distributions do not need the custom wheel-build runner.
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ secrets.SAGEMATH_PYPI_API_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Conda environment
        uses: conda-incubator/setup-miniconda@v3
        continue-on-error: true
        id: conda1
        with:
          python-version: 3.12
          use-mamba: true
          channels: conda-forge
          channel-priority: true
          activate-environment: sage-dev
          environment-file: environment-3.12-linux.yml

      - name: Setup Conda environment (2nd time)
        uses: conda-incubator/setup-miniconda@v3
        if: steps.conda1.outcome == 'failure'
        with:
          python-version: 3.12
          use-mamba: true
          channels: conda-forge
          channel-priority: true
          activate-environment: sage-dev
          environment-file: environment-3.12-linux.yml

      - name: Create source distribution
        shell: bash -l {0}
        run: |
          conda install --yes python-build
          python -m build --sdist --no-isolation --outdir dist .
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          path: "dist/*.tar.gz"
          name: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.SAGEMATH_PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
        if: env.CAN_DEPLOY == 'true'

  release:
    needs: [release_dist, sdists, build_wheels]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release_dist

      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-*-*-wheels"
          path: wheelhouse
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-gap-runtime"
          path: gap-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-ecm-runtime"
          path: ecm-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-maxima-runtime"
          path: maxima-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-nauty-runtime"
          path: nauty-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-pari-data"
          path: pari-data-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-singular-runtime"
          path: singular-runtime-dist
          merge-multiple: true

      - name: Create release notes
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          latest_release_tag=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases \
          | jq -r 'sort_by(.created_at) | last(.[]).tag_name')
          release_notes=$(curl -s \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases/generate-notes \
            -d "{
              \"tag_name\": \"${{ github.ref_name }}\",
              \"previous_tag_name\": \"$latest_release_tag\"
            }" | jq -r '.body')
          echo "$release_notes" > release_notes

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            wheelhouse/*.whl
            gap-runtime-dist/*.whl
            ecm-runtime-dist/*.whl
            maxima-runtime-dist/*.whl
            nauty-runtime-dist/*.whl
            pari-data-dist/*.whl
            singular-runtime-dist/*.whl
            upstream/*
          token: ${{ github.token }}
          body_path: release_notes
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  build_wheels:
    name: wheels ${{ matrix.python }} ${{ matrix.build }}*_${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: sdists
    strategy:
      fail-fast: false
      # The Sage native dependency build runs package autotuning steps; avoid
      # the full matrix stampede, but do not let one queued runner block all
      # remaining wheels.
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cibw_platform: manylinux_x86_64
            build: manylinux
            python: cp312
            python_version: "3.12"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-latest
            arch: x86_64
            cibw_platform: manylinux_x86_64
            build: manylinux
            python: cp313
            python_version: "3.13"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-latest
            arch: x86_64
            cibw_platform: manylinux_x86_64
            build: manylinux
            python: cp314
            python_version: "3.14"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-24.04-arm
            arch: aarch64
            cibw_platform: manylinux_aarch64
            build: manylinux
            python: cp312
            python_version: "3.12"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-24.04-arm
            arch: aarch64
            cibw_platform: manylinux_aarch64
            build: manylinux
            python: cp313
            python_version: "3.13"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-24.04-arm
            arch: aarch64
            cibw_platform: manylinux_aarch64
            build: manylinux
            python: cp314
            python_version: "3.14"
            requires_python: ">=3.12, <3.15"
    env:
      CAN_DEPLOY: ${{ secrets.SAGEMATH_PYPI_API_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
      # SPKGs to install as system packages
      SPKGS: _bootstrap _prereq
      # Non-Python packages to install as spkgs
      TARGETS_PRE: gmp mpfr mpc mpfi openblas gsl libgd pari flint m4ri m4rie brial ecm fflas_ffpack linbox gap gap_packages singular ecl maxima lcalc eclib libbraiding libhomfly nauty symmetrica cliquer planarity glpk bliss coxeter3 mcqd meataxe sirocco tdlib
      # Build the supported Linux Python ABI/platform set for PyPI.
      CIBW_BUILD: "${{ matrix.python }}-${{ matrix.cibw_platform }}"
      # Python 3.14 is still a prerelease ABI in cibuildwheel 3.0.x.
      CIBW_ENABLE: "cpython-prerelease"
      CIBW_ARCHS: ${{ matrix.arch }}
      # https://cibuildwheel.readthedocs.io/en/stable/options/#requires-python
      CIBW_PROJECT_REQUIRES_PYTHON: "${{ matrix.requires_python }}"
      CIBW_BEFORE_ALL_LINUX: "bash .github/workflows/cibw-before-all-linux.sh"
      CIBW_BEFORE_BUILD: "bash .github/workflows/cibw-before-build-linux.sh"
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "bash .github/workflows/repair-wheel-linux.sh {wheel} {dest_dir}"
      # Environment during wheel build
      CIBW_ENVIRONMENT: "PATH=/project/build/bin:$PATH:/host/sage-${AUDITWHEEL_PLAT}/bin:$(pwd)/prefix/bin SAGE_PYTHON=/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin/python3 CYTHON=/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin/cython CPATH=/host/sage-${AUDITWHEEL_PLAT}/include:$(pwd)/prefix/include:$CPATH LIBRARY_PATH=/host/sage-${AUDITWHEEL_PLAT}/lib:$(pwd)/prefix/lib:$LIBRARY_PATH LD_LIBRARY_PATH=/host/sage-${AUDITWHEEL_PLAT}/lib:$(pwd)/prefix/lib:$LD_LIBRARY_PATH PKG_CONFIG_PATH=/opt/python/${{ matrix.python }}-${{ matrix.python }}/lib/pkgconfig:/opt/python/${{ matrix.python }}-${{ matrix.python }}/lib64/pkgconfig:/host/sage-${AUDITWHEEL_PLAT}/lib/pkgconfig:/host/sage-${AUDITWHEEL_PLAT}/share/pkgconfig:$(pwd)/prefix/lib/pkgconfig:$(pwd)/prefix/share/pkgconfig:$PKG_CONFIG_PATH CMAKE_PREFIX_PATH=/opt/python/${{ matrix.python }}-${{ matrix.python }}:/host/sage-${AUDITWHEEL_PLAT}:$(pwd)/prefix:$CMAKE_PREFIX_PATH ACLOCAL_PATH=/usr/share/aclocal PIP_CONSTRAINT=$(pwd)/constraints.txt PIP_FIND_LINKS=file://$(pwd)/wheelhouse SAGE_NUM_THREADS=6 CCACHE_DIR=/project/.ccache-wheel/${AUDITWHEEL_PLAT}-${{ matrix.python }} CCACHE_BASEDIR=/project/unpacked CCACHE_COMPILERCHECK=content CCACHE_NOHASHDIR=1 CCACHE_MAXSIZE=2G CC='ccache cc' CXX='ccache c++'"
      # Use 'build' without isolation so Meson uses the prepared build environment.
      CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.arch != 'x86_64' && matrix.arch != 'i686'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v5
        # As of 2024-02-03, the macOS M1 runners do not have preinstalled python or pipx.
        # Installing pipx follows the approach of https://github.com/pypa/cibuildwheel/pull/1743
        id: python
        with:
          python-version: ${{ matrix.python_version }}
          update-environment: false

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache-wheel
          key: wheel-ccache-${{ matrix.build }}-${{ matrix.arch }}-${{ matrix.python }}-${{ github.run_id }}
          restore-keys: |
            wheel-ccache-${{ matrix.build }}-${{ matrix.arch }}-${{ matrix.python }}-

      - name: Bootstrap
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          export PATH=$(pwd)/build/bin:$PATH
          eval $(sage-print-system-package-command auto --sudo --yes --no-install-recommends --spkg install _bootstrap _prereq)
          ./bootstrap

      - name: Unpack and prepare
        # We build the wheels from the sdists so that MANIFEST filtering becomes effective.
        # But we must run cibuildwheel with the unpacked source directory, not a tarball,
        # so that SAGE_ROOT is copied into the build containers.
        #
        # In the CIBW_BEFORE_ALL phase, we install libraries using the Sage distribution.
        # https://cibuildwheel.readthedocs.io/en/stable/options/#before-all
        # For Linux, this is repeated for each of the packages that we build wheels for
        # because CIBW starts with a fresh container on each invocation.
        # Therefore we cache it in a directory mounted from the host: /host
        # https://cibuildwheel.pypa.io/en/stable/faq/#linux-builds-in-containers
        #
        # omit sagemath-{meataxe,sirocco} for now -- needs sagemath-modules
        run: |
          "${{ steps.python.outputs.python-path }}" -m pip install cibuildwheel==3.0.1
          mkdir -p unpacked
          for sdist in dist/*.tar.gz; do
              (cd unpacked && tar xfz - ) < $sdist
          done
          mkdir -p .ccache-wheel

      - name: Build wheel
        run: |
          rm -rf gap-runtime-dist
          rm -rf ecm-runtime-dist
          rm -rf maxima-runtime-dist
          rm -rf nauty-runtime-dist
          rm -rf pari-data-dist
          rm -rf singular-runtime-dist
          bash .github/workflows/cibw-build-wheel-linux.sh "${{ steps.python.outputs.python-path }}" wheelhouse unpacked/*

      - name: Separate GAP runtime companion wheel
        if: matrix.python == 'cp312'
        run: |
          set -euo pipefail
          mkdir -p gap-runtime-dist
          find wheelhouse -maxdepth 1 -type f -name "sagelite_gap_runtime-*.whl" -exec mv -v {} gap-runtime-dist/ \;
          test "$(find gap-runtime-dist -maxdepth 1 -type f -name "sagelite_gap_runtime-*.whl" | wc -l)" -eq 1
          ls -lh gap-runtime-dist

      - name: Separate ECM runtime companion wheel
        if: matrix.python == 'cp312'
        run: |
          set -euo pipefail
          mkdir -p ecm-runtime-dist
          find wheelhouse -maxdepth 1 -type f -name "sagelite_ecm_runtime-*.whl" -exec mv -v {} ecm-runtime-dist/ \;
          test "$(find ecm-runtime-dist -maxdepth 1 -type f -name "sagelite_ecm_runtime-*.whl" | wc -l)" -eq 1
          ls -lh ecm-runtime-dist

      - name: Separate Maxima runtime companion wheel
        if: matrix.python == 'cp312'
        run: |
          set -euo pipefail
          mkdir -p maxima-runtime-dist
          find wheelhouse -maxdepth 1 -type f -name "sagelite_maxima_runtime-*.whl" -exec mv -v {} maxima-runtime-dist/ \;
          test "$(find maxima-runtime-dist -maxdepth 1 -type f -name "sagelite_maxima_runtime-*.whl" | wc -l)" -eq 1
          ls -lh maxima-runtime-dist

      - name: Separate nauty runtime companion wheel
        if: matrix.python == 'cp312'
        run: |
          set -euo pipefail
          mkdir -p nauty-runtime-dist
          find wheelhouse -maxdepth 1 -type f -name "sagelite_nauty_runtime-*.whl" -exec mv -v {} nauty-runtime-dist/ \;
          test "$(find nauty-runtime-dist -maxdepth 1 -type f -name "sagelite_nauty_runtime-*.whl" | wc -l)" -eq 1
          ls -lh nauty-runtime-dist

      - name: Separate PARI data companion wheel
        if: matrix.python == 'cp312' && matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          mkdir -p pari-data-dist
          find wheelhouse -maxdepth 1 -type f -name "sagelite_pari_data-*.whl" -exec mv -v {} pari-data-dist/ \;
          test "$(find pari-data-dist -maxdepth 1 -type f -name "sagelite_pari_data-*.whl" | wc -l)" -eq 1
          ls -lh pari-data-dist

      - name: Separate Singular runtime companion wheel
        if: matrix.python == 'cp312' && matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          mkdir -p singular-runtime-dist
          find wheelhouse -maxdepth 1 -type f -name "sagelite_singular_runtime-*.whl" -exec mv -v {} singular-runtime-dist/ \;
          test "$(find singular-runtime-dist -maxdepth 1 -type f -name "sagelite_singular_runtime-*.whl" | wc -l)" -eq 1
          ls -lh singular-runtime-dist

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache-wheel
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Smoke test wheel in a fresh virtualenv
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv test-venv
          test-venv/bin/python -m pip install --upgrade pip
          test-venv/bin/python -m pip install wheelhouse/*.whl
          for companion_dist in gap-runtime-dist ecm-runtime-dist maxima-runtime-dist nauty-runtime-dist pari-data-dist singular-runtime-dist; do
            if compgen -G "$companion_dist/*.whl" > /dev/null; then
              test-venv/bin/python -m pip install "$companion_dist"/*.whl
            fi
          done
          test-venv/bin/sagelite-selftest

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.arch }}-${{ matrix.python }}-wheels
          path: ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        if: matrix.python == 'cp312'
        with:
          name: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.arch }}-gap-runtime
          path: ./gap-runtime-dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.python == 'cp312'
        with:
          name: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.arch }}-ecm-runtime
          path: ./ecm-runtime-dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.python == 'cp312'
        with:
          name: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.arch }}-maxima-runtime
          path: ./maxima-runtime-dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.python == 'cp312'
        with:
          name: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.arch }}-nauty-runtime
          path: ./nauty-runtime-dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.python == 'cp312' && matrix.arch == 'x86_64'
        with:
          name: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.arch }}-pari-data
          path: ./pari-data-dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.python == 'cp312' && matrix.arch == 'x86_64'
        with:
          name: ${{ matrix.os }}-${{ matrix.build }}-${{ matrix.arch }}-singular-runtime
          path: ./singular-runtime-dist/*.whl
          if-no-files-found: error

  upload_wheels:
    # This needs to be a separate job because pypa/gh-action-pypi-publish cannot run on macOS
    needs: build_wheels
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ secrets.SAGEMATH_PYPI_API_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
    steps:

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-*-*-wheels"
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.SAGEMATH_PYPI_API_TOKEN }}
          packages-dir: wheelhouse/
          skip-existing: true
          verbose: true
        if: env.CAN_DEPLOY == 'true'

  upload_gap_runtime:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-gap-runtime"
          path: gap-runtime-dist
          merge-multiple: true

      - name: Verify GAP runtime artifact set
        run: |
          set -euo pipefail
          find gap-runtime-dist -maxdepth 1 -type f -name "*.whl" -print | sort
          test "$(find gap-runtime-dist -maxdepth 1 -type f -name "sagelite_gap_runtime-10.9.post1-py3-none-manylinux_2_28_x86_64.whl" | wc -l)" -eq 1
          test "$(find gap-runtime-dist -maxdepth 1 -type f -name "sagelite_gap_runtime-10.9.post1-py3-none-manylinux_2_28_aarch64.whl" | wc -l)" -eq 1
          test "$(find gap-runtime-dist -maxdepth 1 -type f -name "*.whl" | wc -l)" -eq 2

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: gap-runtime-dist/
          skip-existing: true
          verbose: true

  upload_ecm_runtime:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-ecm-runtime"
          path: ecm-runtime-dist
          merge-multiple: true

      - name: Verify ECM runtime artifact set
        run: |
          set -euo pipefail
          find ecm-runtime-dist -maxdepth 1 -type f -name "*.whl" -print | sort
          test "$(find ecm-runtime-dist -maxdepth 1 -type f -name "sagelite_ecm_runtime-10.9-py3-none-manylinux_2_28_x86_64.whl" | wc -l)" -eq 1
          test "$(find ecm-runtime-dist -maxdepth 1 -type f -name "sagelite_ecm_runtime-10.9-py3-none-manylinux_2_28_aarch64.whl" | wc -l)" -eq 1
          test "$(find ecm-runtime-dist -maxdepth 1 -type f -name "*.whl" | wc -l)" -eq 2

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ecm-runtime-dist/
          skip-existing: true
          verbose: true

  upload_maxima_runtime:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-maxima-runtime"
          path: maxima-runtime-dist
          merge-multiple: true

      - name: Verify Maxima runtime artifact set
        run: |
          set -euo pipefail
          find maxima-runtime-dist -maxdepth 1 -type f -name "*.whl" -print | sort
          test "$(find maxima-runtime-dist -maxdepth 1 -type f -name "sagelite_maxima_runtime-10.9-py3-none-manylinux_2_28_x86_64.whl" | wc -l)" -eq 1
          test "$(find maxima-runtime-dist -maxdepth 1 -type f -name "sagelite_maxima_runtime-10.9-py3-none-manylinux_2_28_aarch64.whl" | wc -l)" -eq 1
          test "$(find maxima-runtime-dist -maxdepth 1 -type f -name "*.whl" | wc -l)" -eq 2

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: maxima-runtime-dist/
          skip-existing: true
          verbose: true

  upload_nauty_runtime:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-nauty-runtime"
