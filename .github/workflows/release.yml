name: Release distributions and wheels

on:
  push:
    tags:
      # Match all release tags including beta, rc
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.beta[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.beta[0-9]+'
      - '[0-9]+.[0-9]+.rc[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.rc[0-9]+'
      - 'sagelite-*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish built artifacts to PyPI"
        required: false
        default: false
        type: boolean
      publish_to_github_pages:
        description: "Publish built wheel artifacts to the gh-pages simple index"
        required: false
        default: false
        type: boolean
      publish_to_cloudflare_pages:
        description: "Publish built wheels to Cloudflare R2 and a Pages simple index"
        required: false
        default: false
        type: boolean

jobs:

  release_dist:

    # This job first checks whether "configure --enable-download-from-upstream-url"
    # (the default since #32390) is needed.
    #
    # In this way, we check that all necessary package tarballs
    # have already been uploaded to the Sage server at the time
    # of pushing a release tag.
    #
    # It also uses "bootstrap -D", thus checking that the "configure"
    # tarball has been uploaded to the Sage server at the time
    # of pushing a release tag.

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bootstrap prerequisites
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install $(build/bin/sage-get-system-packages debian _bootstrap _prereq)
      - name: Configure with --enable-download-from-upstream-url
        run: |
          make configure
          ./configure
      - name: make dist (--enable-download-from-upstream-url)
        id: make_dist
        if: success() || failure()
        run: |
          make dist
        env:
          MAKE: make -j8
      - name: make download (--enable-download-from-upstream-url)
        if: (success() || failure()) && steps.make_dist.outcome != 'success'
        run: |
          make -k download DOWNLOAD_PACKAGES=":all: --no-file huge --allow-upstream"
        env:
          MAKE: make -j8
      - name: Remove what cannot be distributed
        if: success() || failure()
        run: |
          rm -f upstream/*do-not-distribute*
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          path: |
            dist/*.tar.gz
            upstream
          name: release_dist

  sdists:

    # Source distributions do not need the custom wheel-build runner.
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ secrets.SAGEMATH_PYPI_API_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Conda environment
        uses: conda-incubator/setup-miniconda@v3
        continue-on-error: true
        id: conda1
        with:
          python-version: 3.12
          use-mamba: true
          channels: conda-forge
          channel-priority: true
          activate-environment: sage-dev
          environment-file: environment-3.12-linux.yml

      - name: Setup Conda environment (2nd time)
        uses: conda-incubator/setup-miniconda@v3
        if: steps.conda1.outcome == 'failure'
        with:
          python-version: 3.12
          use-mamba: true
          channels: conda-forge
          channel-priority: true
          activate-environment: sage-dev
          environment-file: environment-3.12-linux.yml

      - name: Create source distribution
        shell: bash -l {0}
        run: |
          conda install --yes python-build
          python -m build --sdist --no-isolation \
            --config-setting=setup-args=-Dbliss=auto \
            --config-setting=setup-args=-Dbrial=auto \
            --config-setting=setup-args=-Dcoxeter3=auto \
            --config-setting=setup-args=-Declib=auto \
            --config-setting=setup-args=-Dlibbraiding=auto \
            --config-setting=setup-args=-Dlibhomfly=auto \
            --config-setting=setup-args=-Dmcqd=auto \
            --config-setting=setup-args=-Drankwidth=auto \
            --config-setting=setup-args=-Dsirocco=auto \
            --config-setting=setup-args=-Dtdlib=auto \
            --config-setting=setup-args=-Dbuild-docs=false \
            --outdir dist .
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          path: "dist/*.tar.gz"
          name: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.SAGEMATH_PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
        if: env.CAN_DEPLOY == 'true'

  release:
    needs: [release_dist, sdists, build_wheels]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release_dist

      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-*-*-wheels"
          path: wheelhouse
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-gap-runtime"
          path: gap-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-gap3-runtime"
          path: gap3-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-gfan-runtime"
          path: gfan-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-giac-runtime"
          path: giac-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-glucose-runtime"
          path: glucose-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-graphviz-runtime"
          path: graphviz-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-info-runtime"
          path: info-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-kissat-runtime"
          path: kissat-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-ecm-runtime"
          path: ecm-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-frobby-runtime"
          path: frobby-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-flatter-runtime"
          path: flatter-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-fplll-data"
          path: fplll-data-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-four-ti-2-runtime"
          path: four-ti-2-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-benzene-runtime"
          path: benzene-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-buckygen-runtime"
          path: buckygen-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-cddlib-runtime"
          path: cddlib-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-csdp-runtime"
          path: csdp-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-dvipng-runtime"
          path: dvipng-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-maxima-runtime"
          path: maxima-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-lie-runtime"
          path: lie-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-lcalc-runtime"
          path: lcalc-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-latte-runtime"
          path: latte-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-lrslib-runtime"
          path: lrslib-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-meataxe-runtime"
          path: meataxe-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-mwrank-runtime"
          path: mwrank-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-msolve-runtime"
          path: msolve-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-nauty-runtime"
          path: nauty-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-rubiks-runtime"
          path: rubiks-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-palp-runtime"
          path: palp-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-pdf2svg-runtime"
          path: pdf2svg-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-poppler-runtime"
          path: poppler-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-planarity-runtime"
          path: planarity-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-plantri-runtime"
          path: plantri-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-qepcad-runtime"
          path: qepcad-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-sympow-runtime"
          path: sympow-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-pari-data"
          path: pari-data-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-pari-runtime"
          path: pari-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-singular-runtime"
          path: singular-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-tachyon-runtime"
          path: tachyon-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-tides-runtime"
          path: tides-runtime-dist
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-topcom-runtime"
          path: topcom-runtime-dist
          merge-multiple: true

      - name: Create release notes
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          latest_release_tag=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases \
          | jq -r 'sort_by(.created_at) | last(.[]).tag_name')
          release_notes=$(curl -s \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases/generate-notes \
            -d "{
              \"tag_name\": \"${{ github.ref_name }}\",
              \"previous_tag_name\": \"$latest_release_tag\"
            }" | jq -r '.body')
          echo "$release_notes" > release_notes

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            wheelhouse/*.whl
            gap-runtime-dist/*.whl
            gap3-runtime-dist/*.whl
            gfan-runtime-dist/*.whl
            giac-runtime-dist/*.whl
            glucose-runtime-dist/*.whl
            graphviz-runtime-dist/*.whl
            info-runtime-dist/*.whl
            kissat-runtime-dist/*.whl
            ecm-runtime-dist/*.whl
            frobby-runtime-dist/*.whl
            flatter-runtime-dist/*.whl
            fplll-data-dist/*.whl
            four-ti-2-runtime-dist/*.whl
            benzene-runtime-dist/*.whl
            buckygen-runtime-dist/*.whl
            cddlib-runtime-dist/*.whl
            csdp-runtime-dist/*.whl
            dvipng-runtime-dist/*.whl
            maxima-runtime-dist/*.whl
            lie-runtime-dist/*.whl
            lcalc-runtime-dist/*.whl
            latte-runtime-dist/*.whl
            lrslib-runtime-dist/*.whl
            meataxe-runtime-dist/*.whl
            msolve-runtime-dist/*.whl
            mwrank-runtime-dist/*.whl
            nauty-runtime-dist/*.whl
            rubiks-runtime-dist/*.whl
            palp-runtime-dist/*.whl
            pdf2svg-runtime-dist/*.whl
            poppler-runtime-dist/*.whl
            planarity-runtime-dist/*.whl
            plantri-runtime-dist/*.whl
            qepcad-runtime-dist/*.whl
            sympow-runtime-dist/*.whl
            pari-data-dist/*.whl
            pari-runtime-dist/*.whl
            singular-runtime-dist/*.whl
            tachyon-runtime-dist/*.whl
            tides-runtime-dist/*.whl
            topcom-runtime-dist/*.whl
            upstream/*
          token: ${{ github.token }}
          body_path: release_notes
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  publish_wheel_index:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_github_pages }}
    permissions:
      contents: write
    concurrency:
      group: sagelite-wheel-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-wheels"
          path: wheel-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-runtime"
          path: wheel-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-data"
          path: wheel-artifacts
          merge-multiple: true

      - name: Publish staged wheel index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/workflows/publish-sagelite-wheel-index.sh wheel-artifacts pages

  publish_cloudflare_index:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_to_cloudflare_pages }}
    permissions:
      contents: read
    concurrency:
      group: sagelite-cloudflare-wheel-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-wheels"
          path: wheel-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-runtime"
          path: wheel-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-data"
          path: wheel-artifacts
          merge-multiple: true

      - name: Publish Cloudflare staged wheel index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET || vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SAGELITE_R2_WHEEL_PREFIX: ${{ vars.SAGELITE_R2_WHEEL_PREFIX }}
          SAGELITE_WHEEL_BASE_URL: ${{ vars.SAGELITE_WHEEL_BASE_URL }}
          SAGELITE_SIMPLE_INDEX_URL: ${{ vars.SAGELITE_SIMPLE_INDEX_URL }}
        run: bash .github/workflows/publish-sagelite-cloudflare-index.sh wheel-artifacts cloudflare-pages

  build_wheels:
    name: wheels ${{ matrix.python }} ${{ matrix.build }}*_${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: sdists
    strategy:
      fail-fast: false
      # The Sage native dependency build runs package autotuning steps; avoid
      # the full matrix stampede, but do not let one queued runner block all
      # remaining wheels.
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cibw_platform: manylinux_x86_64
            build: manylinux
            python: cp312
            python_version: "3.12"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-latest
            arch: x86_64
            cibw_platform: manylinux_x86_64
            build: manylinux
            python: cp313
            python_version: "3.13"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-latest
            arch: x86_64
            cibw_platform: manylinux_x86_64
            build: manylinux
            python: cp314
            python_version: "3.14"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-24.04-arm
            arch: aarch64
            cibw_platform: manylinux_aarch64
            build: manylinux
            python: cp312
            python_version: "3.12"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-24.04-arm
            arch: aarch64
            cibw_platform: manylinux_aarch64
            build: manylinux
            python: cp313
            python_version: "3.13"
            requires_python: ">=3.12, <3.15"
          - os: ubuntu-24.04-arm
            arch: aarch64
            cibw_platform: manylinux_aarch64
            build: manylinux
            python: cp314
            python_version: "3.14"
            requires_python: ">=3.12, <3.15"
    env:
      CAN_DEPLOY: ${{ secrets.SAGEMATH_PYPI_API_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
      # SPKGs to install as system packages
      SPKGS: _bootstrap _prereq
      # Non-Python Sage packages and system tools to stage before wheel builds
      TARGETS_PRE: gmp mpfr mpc mpfi openblas gsl libgd pari pari_elldata pari_galdata pari_galpol pari_nftables pari_seadata flint m4ri m4rie brial ecm frobby fflas_ffpack linbox gap gap_packages gap3 gfan giac singular ecl maxima fricas jmol kenzo lcalc eclib libbraiding libhomfly nauty palp 4ti2 rubiks symmetrica cliquer planarity qepcad glpk bliss coxeter3 mcqd meataxe sirocco tdlib glucose kissat graphviz dvipng poppler flatter imagemagick sympow topcom csdp benzene buckygen msolve fplll latte_int lrslib lie pdf2svg plantri tachyon tides
      # Build the supported Linux Python ABI/platform set for PyPI.
      CIBW_BUILD: "${{ matrix.python }}-${{ matrix.cibw_platform }}"
      # Python 3.14 is still a prerelease ABI in cibuildwheel 3.0.x.
      CIBW_ENABLE: "cpython-prerelease"
      CIBW_ARCHS: ${{ matrix.arch }}
      # https://cibuildwheel.readthedocs.io/en/stable/options/#requires-python
      CIBW_PROJECT_REQUIRES_PYTHON: "${{ matrix.requires_python }}"
      CIBW_BEFORE_ALL_LINUX: "bash .github/workflows/cibw-before-all-linux.sh"
      CIBW_BEFORE_BUILD: "bash .github/workflows/cibw-before-build-linux.sh"
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "bash .github/workflows/repair-wheel-linux.sh {wheel} {dest_dir}"
      # Environment during wheel build
      CIBW_ENVIRONMENT: "PATH=/project/build/bin:$PATH:/host/sage-${AUDITWHEEL_PLAT}/bin:$(pwd)/prefix/bin SAGE_PYTHON=/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin/python3 CYTHON=/opt/python/${{ matrix.python }}-${{ matrix.python }}/bin/cython PYTHONPATH=/host/sage-${AUDITWHEEL_PLAT}/lib/python${{ matrix.python_version }}/site-packages:$PYTHONPATH CPATH=/host/sage-${AUDITWHEEL_PLAT}/include:$(pwd)/prefix/include:$CPATH LIBRARY_PATH=/host/sage-${AUDITWHEEL_PLAT}/lib:$(pwd)/prefix/lib:$LIBRARY_PATH LD_LIBRARY_PATH=/host/sage-${AUDITWHEEL_PLAT}/lib:$(pwd)/prefix/lib:$LD_LIBRARY_PATH PKG_CONFIG_PATH=/opt/python/${{ matrix.python }}-${{ matrix.python }}/lib/pkgconfig:/opt/python/${{ matrix.python }}-${{ matrix.python }}/lib64/pkgconfig:/host/sage-${AUDITWHEEL_PLAT}/lib/pkgconfig:/host/sage-${AUDITWHEEL_PLAT}/share/pkgconfig:$(pwd)/prefix/lib/pkgconfig:$(pwd)/prefix/share/pkgconfig:$PKG_CONFIG_PATH CMAKE_PREFIX_PATH=/opt/python/${{ matrix.python }}-${{ matrix.python }}:/host/sage-${AUDITWHEEL_PLAT}:$(pwd)/prefix:$CMAKE_PREFIX_PATH ACLOCAL_PATH=/usr/share/aclocal PIP_CONSTRAINT=$(pwd)/constraints.txt PIP_FIND_LINKS=file://$(pwd)/wheelhouse SAGE_NUM_THREADS=6 CCACHE_DIR=/project/.ccache-wheel/${AUDITWHEEL_PLAT}-${{ matrix.python }} CCACHE_BASEDIR=/project/unpacked CCACHE_COMPILERCHECK=content CCACHE_NOHASHDIR=1 CCACHE_MAXSIZE=2G CC='ccache cc' CXX='ccache c++'"
      CIBW_CONFIG_SETTINGS: "setup-args=-Dbliss=enabled setup-args=-Dbrial=enabled setup-args=-Dcoxeter3=enabled setup-args=-Declib=enabled setup-args=-Dlibbraiding=enabled setup-args=-Dlibhomfly=enabled setup-args=-Dmeataxe=enabled setup-args=-Dmcqd=enabled setup-args=-Drankwidth=enabled setup-args=-Dsirocco=enabled setup-args=-Dtdlib=enabled"
      # Use 'build' without isolation so Meson uses the prepared build environment.
      CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.arch != 'x86_64' && matrix.arch != 'i686'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v5
        # As of 2024-02-03, the macOS M1 runners do not have preinstalled python or pipx.
        # Installing pipx follows the approach of https://github.com/pypa/cibuildwheel/pull/1743
        id: python
        with:
          python-version: ${{ matrix.python_version }}
          update-environment: false

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache-wheel
          key: wheel-ccache-${{ matrix.build }}-${{ matrix.arch }}-${{ matrix.python }}-${{ github.run_id }}
          restore-keys: |
            wheel-ccache-${{ matrix.build }}-${{ matrix.arch }}-${{ matrix.python }}-

      - name: Bootstrap
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          export PATH=$(pwd)/build/bin:$PATH
          eval $(sage-print-system-package-command auto --sudo --yes --no-install-recommends --spkg install _bootstrap _prereq)
          ./bootstrap

      - name: Unpack and prepare
        # We build the wheels from the sdists so that MANIFEST filtering becomes effective.
        # But we must run cibuildwheel with the unpacked source directory, not a tarball,
        # so that SAGE_ROOT is copied into the build containers.
        #
        # In the CIBW_BEFORE_ALL phase, we install libraries using the Sage distribution.
        # https://cibuildwheel.readthedocs.io/en/stable/options/#before-all
        # For Linux, this is repeated for each of the packages that we build wheels for
        # because CIBW starts with a fresh container on each invocation.
        # Therefore we cache it in a directory mounted from the host: /host
        # https://cibuildwheel.pypa.io/en/stable/faq/#linux-builds-in-containers
        #
        # omit sagemath-{meataxe,sirocco} for now -- needs sagemath-modules
        run: |
          "${{ steps.python.outputs.python-path }}" -m pip install cibuildwheel==3.0.1
          mkdir -p unpacked
          for sdist in dist/*.tar.gz; do
              (cd unpacked && tar xfz - ) < $sdist
          done
          mkdir -p .ccache-wheel

      - name: Build wheel
        run: |
          rm -rf gap-runtime-dist
          rm -rf gap3-runtime-dist
