          bash .github/workflows/cibw-build-wheel-linux.sh "${{ steps.python.outputs.python-path }}" wheelhouse unpacked/*

      - name: Verify required native extensions are packaged
        run: |
          "${{ steps.python.outputs.python-path }}" - <<'PY'
          import importlib.util
          import sys
          import zipfile
          from pathlib import Path

          catalog_path = Path("tools/sagelite_native_wheel_catalog.py")
          spec = importlib.util.spec_from_file_location(
              "sagelite_native_wheel_catalog", catalog_path
          )
          catalog_module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(catalog_module)
          catalog = catalog_module.catalog()

          wheels = sorted(Path("wheelhouse").glob("sagelite-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one sagelite wheel, found {len(wheels)}: {wheels}")

          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()

          missing = [
              prefix
              for prefix in catalog["required_native_extension_prefixes"]
              if not any(name.startswith(prefix) and name.endswith(".so") for name in names)
          ]
          if missing:
              print(f"Missing required native extensions in {wheels[0]}:", file=sys.stderr)
              for prefix in missing:
                  print(f"  {prefix}*.so", file=sys.stderr)
              raise SystemExit(1)

          missing_libraries = [
              library
              for library in catalog["required_native_library_prefixes"]
              if not any(
                  name.startswith("sagelite.libs/")
                  and Path(name).name.startswith(library)
                  and ".so" in Path(name).name
                  for name in names
              )
          ]
          if missing_libraries:
              print(f"Missing required bundled native libraries in {wheels[0]}:", file=sys.stderr)
              for library in missing_libraries:
                  print(f"  {library}*.so*", file=sys.stderr)
              raise SystemExit(1)
          PY

