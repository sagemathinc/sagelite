  upload_wheels:
    # This needs to be a separate job because pypa/gh-action-pypi-publish cannot run on macOS
    needs: build_wheels
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ secrets.SAGEMATH_PYPI_API_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
    steps:

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-*-*-wheels"
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.SAGEMATH_PYPI_API_TOKEN }}
          packages-dir: wheelhouse/
          skip-existing: true
          verbose: true
        if: env.CAN_DEPLOY == 'true'

  upload_gap_runtime:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-gap-runtime"
          path: gap-runtime-dist
          merge-multiple: true

      - name: Verify GAP runtime artifact set
        run: |
          set -euo pipefail
          find gap-runtime-dist -maxdepth 1 -type f -name "*.whl" -print | sort
          test "$(find gap-runtime-dist -maxdepth 1 -type f -name "sagelite_gap_runtime-10.9.post4-py3-none-manylinux_2_28_x86_64.whl" | wc -l)" -eq 1
