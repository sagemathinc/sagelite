[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagelite-graphviz-runtime"
version = "10.9.post2"
description = "Optional Graphviz executable companion package for sagelite"
readme = "README.md"
requires-python = ">=3.12"
license = "EPL-1.0"
authors = [
  { name = "The Sage Developers", email = "sage-support@googlegroups.com" },
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
urls = { Homepage = "https://www.sagemath.org" }

[project.scripts]
dot = "sagelite_graphviz.runtime:dot"
neato = "sagelite_graphviz.runtime:neato"
twopi = "sagelite_graphviz.runtime:twopi"
fdp = "sagelite_graphviz.runtime:fdp"
circo = "sagelite_graphviz.runtime:circo"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sagelite_graphviz = [
  "data/bin/*",
  "data/lib/*",
  "data/lib/graphviz/*",
]
