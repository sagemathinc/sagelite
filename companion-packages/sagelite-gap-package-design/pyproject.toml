[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagelite-gap-package-design"
version = "10.9"
description = "Optional GAP DESIGN package companion wheel for sagelite"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
authors = [
  { name = "The Sage Developers", email = "sage-support@googlegroups.com" },
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
urls = { Homepage = "https://www.sagemath.org" }

[project.entry-points."sagemath.gap_root_paths"]
design = "sagelite_gap_package_design.runtime:gap_root_paths"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sagelite_gap_package_design = ["data/gaproot/pkg/**/*"]
