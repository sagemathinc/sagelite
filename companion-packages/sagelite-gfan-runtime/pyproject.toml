[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagelite-gfan-runtime"
version = "10.9"
description = "Optional gfan executable companion package for sagelite"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
authors = [
  { name = "The Sage Developers", email = "sage-support@googlegroups.com" },
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
urls = { Homepage = "https://www.sagemath.org" }

[project.scripts]
gfan = "sagelite_gfan.runtime:gfan"
gfan_bases = "sagelite_gfan.runtime:gfan_bases"
gfan_buchberger = "sagelite_gfan.runtime:gfan_buchberger"
gfan_combinerays = "sagelite_gfan.runtime:gfan_combinerays"
gfan_doesidealcontain = "sagelite_gfan.runtime:gfan_doesidealcontain"
gfan_fancommonrefinement = "sagelite_gfan.runtime:gfan_fancommonrefinement"
gfan_fanhomology = "sagelite_gfan.runtime:gfan_fanhomology"
gfan_fanisbalanced = "sagelite_gfan.runtime:gfan_fanisbalanced"
gfan_fanlink = "sagelite_gfan.runtime:gfan_fanlink"
gfan_fanproduct = "sagelite_gfan.runtime:gfan_fanproduct"
gfan_fansubfan = "sagelite_gfan.runtime:gfan_fansubfan"
gfan_genericlinearchange = "sagelite_gfan.runtime:gfan_genericlinearchange"
gfan_groebnercone = "sagelite_gfan.runtime:gfan_groebnercone"
gfan_groebnerfan = "sagelite_gfan.runtime:gfan_groebnerfan"
gfan_homogeneityspace = "sagelite_gfan.runtime:gfan_homogeneityspace"
gfan_homogenize = "sagelite_gfan.runtime:gfan_homogenize"
gfan_initialforms = "sagelite_gfan.runtime:gfan_initialforms"
gfan_interactive = "sagelite_gfan.runtime:gfan_interactive"
gfan_ismarkedgroebnerbasis = "sagelite_gfan.runtime:gfan_ismarkedgroebnerbasis"
gfan_krulldimension = "sagelite_gfan.runtime:gfan_krulldimension"
gfan_latticeideal = "sagelite_gfan.runtime:gfan_latticeideal"
gfan_leadingterms = "sagelite_gfan.runtime:gfan_leadingterms"
gfan_list = "sagelite_gfan.runtime:gfan_list"
gfan_markpolynomialset = "sagelite_gfan.runtime:gfan_markpolynomialset"
gfan_minkowskisum = "sagelite_gfan.runtime:gfan_minkowskisum"
gfan_minors = "sagelite_gfan.runtime:gfan_minors"
gfan_mixedvolume = "sagelite_gfan.runtime:gfan_mixedvolume"
gfan_overintegers = "sagelite_gfan.runtime:gfan_overintegers"
gfan_padic = "sagelite_gfan.runtime:gfan_padic"
gfan_polynomialsetunion = "sagelite_gfan.runtime:gfan_polynomialsetunion"
gfan_render = "sagelite_gfan.runtime:gfan_render"
gfan_renderstaircase = "sagelite_gfan.runtime:gfan_renderstaircase"
gfan_resultantfan = "sagelite_gfan.runtime:gfan_resultantfan"
gfan_saturation = "sagelite_gfan.runtime:gfan_saturation"
gfan_secondaryfan = "sagelite_gfan.runtime:gfan_secondaryfan"
gfan_stats = "sagelite_gfan.runtime:gfan_stats"
gfan_substitute = "sagelite_gfan.runtime:gfan_substitute"
gfan_symmetries = "sagelite_gfan.runtime:gfan_symmetries"
gfan_tolatex = "sagelite_gfan.runtime:gfan_tolatex"
gfan_topolyhedralfan = "sagelite_gfan.runtime:gfan_topolyhedralfan"
gfan_tropicalbasis = "sagelite_gfan.runtime:gfan_tropicalbasis"
gfan_tropicalbruteforce = "sagelite_gfan.runtime:gfan_tropicalbruteforce"
gfan_tropicalcurve = "sagelite_gfan.runtime:gfan_tropicalcurve"
