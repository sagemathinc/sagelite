[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=68", "wheel"]

[project]
authors = [
  { name = "The Sage Developers", email = "sage-support@googlegroups.com" },
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
description = "Stein-Watkins mini elliptic curve database companion package for sagelite"
license = "LicenseRef-Public-Domain"
name = "sagelite-database-stein-watkins-mini"
readme = "README.md"
requires-python = ">=3.12"
urls = { Homepage = "https://www.sagemath.org" }
version = "10.9"

[project.entry-points."sagemath.data_paths"]
stein_watkins = "sagelite_database_stein_watkins_mini:sage_data_path"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sagelite_database_stein_watkins_mini = [
  "data/stein_watkins/a.000.bz2",
  "data/stein_watkins/a.001.bz2",
  "data/stein_watkins/p.00.bz2",
]
