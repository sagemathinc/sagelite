[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagelite-palp-runtime"
version = "10.9"
description = "Optional PALP executable companion package for sagelite"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
authors = [
  { name = "The Sage Developers", email = "sage-support@googlegroups.com" },
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
urls = { Homepage = "https://www.sagemath.org" }

[project.scripts]
"class.x" = "sagelite_palp.runtime:class_x"
"class-4d.x" = "sagelite_palp.runtime:class_4d_x"
"class-5d.x" = "sagelite_palp.runtime:class_5d_x"
"class-6d.x" = "sagelite_palp.runtime:class_6d_x"
"class-11d.x" = "sagelite_palp.runtime:class_11d_x"
"cws.x" = "sagelite_palp.runtime:cws_x"
"cws-4d.x" = "sagelite_palp.runtime:cws_4d_x"
"cws-5d.x" = "sagelite_palp.runtime:cws_5d_x"
"cws-6d.x" = "sagelite_palp.runtime:cws_6d_x"
"cws-11d.x" = "sagelite_palp.runtime:cws_11d_x"
"nef.x" = "sagelite_palp.runtime:nef_x"
"nef-4d.x" = "sagelite_palp.runtime:nef_4d_x"
"nef-5d.x" = "sagelite_palp.runtime:nef_5d_x"
"nef-6d.x" = "sagelite_palp.runtime:nef_6d_x"
"nef-11d.x" = "sagelite_palp.runtime:nef_11d_x"
"poly.x" = "sagelite_palp.runtime:poly_x"
"poly-4d.x" = "sagelite_palp.runtime:poly_4d_x"
"poly-5d.x" = "sagelite_palp.runtime:poly_5d_x"
"poly-6d.x" = "sagelite_palp.runtime:poly_6d_x"
"poly-11d.x" = "sagelite_palp.runtime:poly_11d_x"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sagelite_palp = [
  "data/bin/*",
]
