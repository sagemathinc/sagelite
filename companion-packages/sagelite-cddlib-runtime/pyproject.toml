[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagelite-cddlib-runtime"
version = "10.9"
description = "Optional cddlib executable companion package for sagelite"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
authors = [
  { name = "The Sage Developers", email = "sage-support@googlegroups.com" },
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
urls = { Homepage = "https://www.sagemath.org" }

[project.scripts]
cddexec = "sagelite_cddlib.runtime:cddexec"
cddexec_gmp = "sagelite_cddlib.runtime:cddexec_gmp"
redcheck_gmp = "sagelite_cddlib.runtime:redcheck_gmp"
scdd = "sagelite_cddlib.runtime:scdd"
scdd_gmp = "sagelite_cddlib.runtime:scdd_gmp"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sagelite_cddlib = [
  "data/bin/*",
  "data/lib/*",
]
