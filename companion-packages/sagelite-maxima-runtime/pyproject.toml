[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagelite-maxima-runtime"
version = "10.9.post12"
description = "Optional Maxima runtime companion package for sagelite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sagelite-ecl-runtime >=10.9,<10.10",
]
license = "GPL-2.0-or-later"
authors = [
  { name = "The Sage Developers", email = "sage-support@googlegroups.com" },
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
urls = { Homepage = "https://www.sagemath.org" }

[project.scripts]
maxima = "sagelite_maxima.runtime:maxima"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sagelite_maxima = [
  "data/bin/*",
  "data/lib/**/*",
  "data/share/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = [
  "__pycache__/*",
  "*.pyc",
  "*.pyo",
]
